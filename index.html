<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Productos - Firebase</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">

  <!-- Barra de Navegación -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary px-4">
    <a class="navbar-brand fw-bold" href="#">Gestor de Productos</a>
    <div class="ms-auto d-flex align-items-center">
      
      <!-- Botones cuando NO hay sesión -->
      <div class="logged-out">
        <button class="btn btn-outline-light me-2" data-bs-toggle="modal" data-bs-target="#signinModal">Iniciar sesión</button>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#signupModal">Registrarse</button>
      </div>

      <!-- Correo y Cerrar sesión cuando SÍ hay sesión -->
      <div class="logged-in" style="display: none;">
        <span id="user-email-nav" class="text-light me-3 fw-semibold"></span>
        <button class="btn btn-danger btn-sm" id="logout-btn">Cerrar sesión</button>
      </div>

    </div>
  </nav>

  <!-- Contenido Principal -->
  <div class="container mt-4">
    <div class="row justify-content-center">
      <div class="col-md-10">
        
        <!-- Cuadro cuando NO hay sesión -->
        <div class="logged-out p-5 bg-secondary rounded shadow text-center">
          <h2>No has iniciado sesión.</h2>
          <p class="lead">Usa los botones superiores para registrarte o ingresar al gestor.</p>
        </div>

        <!-- Módulo de Productos cuando SÍ hay sesión -->
        <div class="logged-in" style="display: none;">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h3>Mis Productos</h3>
            <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#productModal">
              + Nuevo Producto
            </button>
          </div>

          <!-- Listado de Productos -->
          <div id="products-container" class="row row-cols-1 row-cols-md-3 g-4">
            <!-- Dinámico -->
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Modal para Crear Producto -->
  <div class="modal fade text-dark" id="productModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Registrar Producto</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="product-form">
            <div class="mb-3">
              <label class="form-label">Nombre</label>
              <input type="text" class="form-control" id="prod-nombre" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Descripción</label>
              <textarea class="form-control" id="prod-descripcion" rows="2" required></textarea>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Precio ($)</label>
                <input type="number" step="0.01" class="form-control" id="prod-precio" required>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Existencias</label>
                <input type="number" class="form-control" id="prod-existencias" required>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">Categoría</label>
              <input type="text" class="form-control" id="prod-categoria" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Imágenes (Mínimo 1, Máximo 5)</label>
              <input type="file" class="form-control" id="prod-imagenes" accept="image/*" multiple required>
              <div class="form-text">Se comprimirán automáticamente para Firestore.</div>
            </div>
            <button type="submit" class="btn btn-primary w-100">Guardar Producto</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal de Iniciar Sesión -->
  <div class="modal fade text-dark" id="signinModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Iniciar Sesión</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="signin-form">
            <div class="mb-3">
              <label class="form-label">Correo electrónico</label>
              <input type="email" class="form-control" id="signin-email" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Contraseña</label>
              <input type="password" class="form-control" id="signin-password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 mb-3" data-bs-dismiss="modal">Iniciar sesión con Correo</button>
          </form>
          <hr>
          <div class="d-grid gap-2">
            <button id="btn-google-in" class="btn btn-outline-danger">Ingresar con Google</button>
            <button id="btn-facebook-in" class="btn btn-outline-primary">Ingresar con Facebook</button>
            <button id="btn-github-in" class="btn btn-outline-dark">Ingresar con GitHub</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal de Registro -->
  <div class="modal fade text-dark" id="signupModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Crear Cuenta</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="signup-form">
            <div class="mb-3">
              <label class="form-label">Correo electrónico</label>
              <input type="email" class="form-control" id="signup-email" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Contraseña (mínimo 6 caracteres)</label>
              <input type="password" class="form-control" id="signup-password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 mb-3" data-bs-dismiss="modal">Registrarse con Correo</button>
          </form>
          <hr>
          <div class="d-grid gap-2">
            <button id="btn-google-up" class="btn btn-outline-danger">Registrarse con Google</button>
            <button id="btn-facebook-up" class="btn btn-outline-primary">Registrarse con Facebook</button>
            <button id="btn-github-up" class="btn btn-outline-dark">Registrarse con GitHub</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Script Principal -->
  <script type="module" src="./app/main.js"></script>
</body>
</html>
